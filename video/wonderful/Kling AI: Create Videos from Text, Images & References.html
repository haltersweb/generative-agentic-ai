    ; (function () {
      var pathname = window.location.pathname

        document.head.appendChild(link)

      function setMeta(selector, attrs, content) {

            meta.setAttribute(key, attrs[key])

          document.head.appendChild(meta)
        }
        meta.setAttribute('content', content)

      function toTitleText(segment) {
        return segment
          .split(/[-_]+/)
          .filter(Boolean)
          .map(function (word) {
            return word.toLowerCase() === 'ai'
              ? 'AI'
              : word.charAt(0).toUpperCase() + word.slice(1)
          })
          .join(' ')

      function buildOgTitle(pathname) {
        var parts = (pathname || '/app')
          .replace(/^\/+/, '')
          .split('/')
          .filter(function (part) {
            return part && part !== 'app' && part !== 'new' && part !== 'edit'
          })
          .map(toTitleText)
        if (pathname === '/app/all-tools') {
          return 'Kling AI: Video, Image & Creative Tools'
        } else if (pathname === '/app/video/new') {
          return 'Kling AI: Create Videos from Text, Images & References'
        } else if (pathname === '/app/image/new') {
          return 'Kling AI: AI Image Generator & Creative Tools'
        } else if (pathname === '/app/omni/new') {

        } else if (pathname === '/app/face-model/new') {
          return 'Kling AI: Create a Reusable Face Model for Creative Workflows'
        }

        return parts.length
          ? 'Kling AI ' + parts.join(' ') + ' | Kling AI'
          : 'Kling AI: Next-Generation AI Creative Studio'
      }

      function buildMetaDescription(pathname, title) {
        var normalizedPath = pathname || '/app'
        var defaultDescription =

        if (normalizedPath === '/app') {

        } else if (normalizedPath === '/app/all-tools') {

          '@type': 'BreadcrumbList',
          '@id': pageUrl + '#breadcrumb',

      var ogImage = window.location.origin.replace(/\/+$/, '') + '/logo-180x180.png'
      setMeta('meta[name="description"]', { name: 'description' }, metaDescription)

      setMeta('meta[name="twitter:description"]', { name: 'twitter:description' }, metaDescription)

      setBreadcrumbJsonLd(normalizedPath, ogTitle)
    })()

  <h1 id="kling-seo-h1" class="kling-seo-h1">Kling AI Video and Image Generator</h1>
  <script>
      ; (function () {
        var labelOverrides = {
  "app": "Home",
  "activity": "Activity",
  "activity-zone": "Activity Zone",
  "image": "Image Generator",
  "image-stylize": "Image Stylize",
  "single-image": "Single Image Generator",
  "multi-image": "Multi Image Generator",
  "video": "Video Generator",
  "image-to-video": "Image to Video",
  "text-to-video": "Text to Video",
  "multi-image-video": "Multi Image to Video",
  "image-to-image": "Image to Image",
  "text-to-image": "Text to Image",
  "lip-sync": "Lip Sync",
  "effects-template": "Effects Template",
  "membership": "Membership",
  "community": "Community",
  "hot-rank": "Hot Rank",
  "all-tools": "All Tools",
  "account": "Account"
}

        function toTitleText(segment) {
          if (labelOverrides[segment]) {
            return labelOverrides[segment]
          }
          return segment
            .split(/[-_]+/)
            .filter(Boolean)
            .map(function (word) {
              if (word.toLowerCase() === 'ai') {
                return 'AI'
              }
              return word.charAt(0).toUpperCase() + word.slice(1)
            })
            .join(' ')
        }

        function buildSeoH1(pathname) {
          var normalizedPath = (pathname || '/app').split('?')[0].split('#')[0]
          if (normalizedPath !== '/' && normalizedPath.endsWith('/')) {
            normalizedPath = normalizedPath.slice(0, -1)
          }
          if (normalizedPath === '/app') {
            return 'Create Videos, Images and More in One Workspace'
          } else if (normalizedPath === '/app/video/new') {
            return 'Create Videos from Text, Images and References'
          } else if (normalizedPath === '/app/omni/new') {
            return 'Kling AI Omni Generator'
          } else if (normalizedPath === '/app/video-motion-control/new') {
            return 'Control Character Motion from a Reference Video'
          } else if (normalizedPath === '/app/ai-human/new') {
            return 'Create an AI Human with Images and Speech'
          } else if (normalizedPath === '/app/face-model/new') {
            return 'Create and Manage a Reusable Face Model'
          } else if (normalizedPath === '/app/image-stylize/new') {
            return 'Kling IMAGE 2.1 Image Generator'
          } else if (normalizedPath === '/app/image-edit') {
            return 'Edit Images by Describing What You Want to Change'
          } else if (normalizedPath === '/app/multi-image/new') {
            return 'Kling IMAGE 2.1 Multi-Image Generator'
          } else if (normalizedPath === '/app/single-image/new') {
            return 'Kling IMAGE 2.1 Single Image Generator'
          } else if (normalizedPath === '/app/commission-share') {
            return 'Become a Kling AI Affiliate'
          } else if (normalizedPath === '/app/creator-apply') {
            return 'Elite Creators Program'
          } else if (normalizedPath === '/app/creator-share') {
            return 'Global Exposure Invitation'
          } else if (normalizedPath === '/app/director-plan') {
            return 'Kling AI Movie Co-Creation Project'
          } else if (normalizedPath === '/app/invitation') {
            return 'Kling AI Referral Program'
          } else if (normalizedPath === '/app/subscribing') {
            return 'Thank you for subscribing'
          }

          var parts = normalizedPath
            .replace(/^\/+/, '')
            .split('/')
            .filter(function (part) {
              return part && part !== 'app' && part !== 'new' && part !== 'edit'
            })
            .map(toTitleText)

          return parts.length ? 'Kling AI ' + parts.join(' ') : 'Kling AI Home'
        }

        function updateSeoH1() {
          var heading = document.getElementById('kling-seo-h1')
          var pathname = window.location.pathname
          var normalizedPath = pathname.split('?')[0].split('#')[0]
          if (normalizedPath !== '/' && normalizedPath.endsWith('/')) {
            normalizedPath = normalizedPath.slice(0, -1)
          }
          // 这些页用顶栏 H1，不保留隐藏 SEO H1
          if (
            normalizedPath === '/app/special-effects/new' ||
            normalizedPath === '/app/ai-human/video/new' ||
            normalizedPath === '/app/try-on/model/new' ||
            normalizedPath === '/app/try-on/try-on/new' ||
            normalizedPath === '/app/text-to-audio/new' ||
            normalizedPath === '/app/video-to-audio/new' ||
            normalizedPath === '/app/video-extend/new' ||
            normalizedPath === '/app/lip-sync/new' ||
            normalizedPath === '/app/all-tools' ||
            normalizedPath === '/app/cli' ||
            normalizedPath === '/app/mcp' ||
            normalizedPath === '/app/mcp/guide'
          ) {
            if (heading) heading.remove()
            return
          }
          if (!heading) {
            heading = document.createElement('h1')
            heading.id = 'kling-seo-h1'
            heading.className = 'kling-seo-h1'
            var app = document.getElementById('app')
            document.body.insertBefore(heading, app || document.body.firstChild)
          }
          heading.textContent = buildSeoH1(pathname)
        }

        updateSeoH1()

        if (!window.history.pushState.__klingSeoWrapped) {
          var rawPushState = window.history.pushState
          window.history.pushState = function () {
            rawPushState.apply(this, arguments)
            updateSeoH1()
          }
          window.history.pushState.__klingSeoWrapped = true
        }

        if (!window.history.replaceState.__klingSeoWrapped) {
          var rawReplaceState = window.history.replaceState
          window.history.replaceState = function () {
            rawReplaceState.apply(this, arguments)
            updateSeoH1()
          }
          window.history.replaceState.__klingSeoWrapped = true
        }

        if (!window.__klingSeoPopstateWrapped) {
          window.addEventListener('popstate', updateSeoH1)
          window.__klingSeoPopstateWrapped = true
        }
      })()
  </script>
