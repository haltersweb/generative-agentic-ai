<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adina Halter — Generative and agentic AI</title>
<meta name="description" content="A growing portfolio of generative and agentic AI work by Adina Halter, shared with the prompts, direction, and decisions behind each project.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F2F3F0;
  --paper-raised: #FFFFFF;
  --ink: #1B1E23;
  --graphite: #535964;
  --rule: #CDD0CA;
  --rule-strong: #1B1E23;
  --lamp: #E8B04B;
  --lamp-text: #8A5A0E;
  --lamp-wash: #F7E7C4;
  --night: #121A2B;
  --night-raised: #1C2640;
  --night-rule: #33405E;
  --snow: #EEF1F6;
  --snow-dim: #A9B3C6;
  --focus: #2F5BD3;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --measure: 68ch;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #15171B;
    --paper-raised: #1E2126;
    --ink: #ECEDEA;
    --graphite: #A3A8B1;
    --rule: #33373E;
    --rule-strong: #ECEDEA;
    --lamp-text: #F0C06A;
    --lamp-wash: #3A2C12;
    --night: #0B1120;
    --night-raised: #152036;
    --focus: #8AA8FF;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1.0625rem;
  line-height: 1.6;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 2px; }
[tabindex="-1"]:focus { outline: none; }
button { font: inherit; color: inherit; cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 1rem; top: -4rem; background: var(--ink); color: var(--paper); padding: .6rem 1rem; z-index: 10; }
.skip:focus { top: 1rem; }

.wrap { width: min(1120px, 100% - 2.5rem); margin-inline: auto; }

/* Masthead */
.masthead { border-bottom: 1px solid var(--rule); }
.masthead .wrap { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-block: 1.1rem; flex-wrap: wrap; }
.brand { font-family: var(--serif); font-size: 1.6rem; line-height: 1; text-decoration: none; }
.brand span { color: var(--graphite); font-style: italic; }
.masthead nav { display: flex; gap: 1.5rem; font-size: .95rem; }
.masthead nav a { text-decoration: none; color: var(--graphite); }
.masthead nav a:hover, .masthead nav a[aria-current="page"] { color: var(--ink); text-decoration: underline; }

/* Index view */
.intro { padding-block: clamp(3rem, 8vw, 6.5rem) clamp(2rem, 5vw, 3.5rem); display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
.intro h1 {
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(2.6rem, 6.5vw, 5.25rem); line-height: 1.02; letter-spacing: -0.01em;
  margin: 0; max-width: 16ch;
}
.intro p { margin: 0; max-width: 52ch; color: var(--graphite); font-size: 1.15rem; }

.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; border-top: 2px solid var(--rule-strong); padding-top: 1rem; }
.toolbar h2 { font-family: var(--serif); font-weight: 400; font-size: 1.9rem; margin: 0; }
.filters { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip {
  border: 1px solid var(--rule); background: transparent; border-radius: 999px;
  padding: .35rem .9rem; font-size: .9rem; color: var(--graphite);
}
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip .count { margin-left: .35rem; font-size: .82em; font-variant-numeric: tabular-nums; }

.entries { list-style: none; margin: 1.25rem 0 0; padding: 0; }
.entry { border-top: 1px solid var(--rule); }
.entry-row {
  position: relative;
  display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) 15rem; gap: 1.5rem;
  padding: 1.75rem 0; align-items: start;
}
.entry-link { text-decoration: none; }
.entry-link::after { content: ""; position: absolute; inset: 0; }
.entry-link:focus-visible { outline: none; }
.entry-link:focus-visible::after { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
.entry-num { font-family: var(--serif); font-size: 2.6rem; line-height: 1; color: var(--lamp-text); }
.entry h3 { overflow-wrap: anywhere; font-family: var(--serif); font-weight: 400; font-size: clamp(1.9rem, 3.5vw, 2.6rem); line-height: 1.05; margin: 0 0 .5rem; }
.entry-row:hover h3 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.entry p { margin: 0; max-width: 58ch; color: var(--graphite); }
.tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .9rem; }
.tag { font-size: .8rem; padding: .15rem .6rem; border-radius: 4px; background: var(--paper-raised); border: 1px solid var(--rule); color: var(--graphite); }
.tag.status { background: var(--lamp-wash); border-color: transparent; color: var(--lamp-text); font-weight: 500; }
.entry-thumbs { display: flex; gap: .5rem; justify-content: flex-end; }
.entry-thumbs .thumb { width: 6.5rem; aspect-ratio: 4 / 5; border-radius: 4px; overflow: hidden; background: var(--night); }
.entry-thumbs img { width: 100%; height: 100%; object-fit: cover; }
.entry-open { grid-column: 2; font-size: .95rem; font-weight: 500; }

.entry.upcoming { border-top-style: dashed; }
.upcoming-inner { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 1.5rem; padding: 1.75rem 0 2.5rem; color: var(--graphite); }
.upcoming-inner .entry-num { color: var(--graphite); }
.empty { padding: 2.5rem 0; color: var(--graphite); border-top: 1px solid var(--rule); }

.about { border-top: 2px solid var(--rule-strong); margin-top: 3rem; padding-block: 2rem 4rem; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 2rem; }
.about h2 { font-family: var(--serif); font-weight: 400; font-size: 1.9rem; margin: 0; }
.about p { margin: 0 0 1rem; max-width: var(--measure); }

/* Project view */
.screen { background: var(--night); color: var(--snow); position: relative; overflow: hidden; }
.screen::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,.55) 0 1px, transparent 1.5px),
                    radial-gradient(circle at 70% 60%, rgba(255,255,255,.4) 0 1px, transparent 1.5px),
                    radial-gradient(circle at 45% 80%, rgba(255,255,255,.3) 0 1px, transparent 1.5px);
  background-size: 180px 180px, 240px 240px, 310px 310px;
  opacity: .5;
}
@media (prefers-reduced-motion: no-preference) {
  .screen::before { animation: snow 40s linear infinite; }
  @keyframes snow { to { background-position: 60px 180px, -40px 240px, 30px 310px; } }
}
.screen .wrap { position: relative; }
.back { display: inline-flex; gap: .4rem; align-items: center; margin-top: 1.5rem; color: var(--snow-dim); text-decoration: none; font-size: .95rem; }
.back:hover { color: var(--snow); text-decoration: underline; }
.premiere { padding-block: clamp(2.5rem, 7vw, 5.5rem) clamp(2.5rem, 6vw, 4.5rem); max-width: 50rem; }
.premiere .status-line { color: var(--lamp); font-size: .95rem; margin: 0 0 1rem; }
.premiere h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(3.5rem, 12vw, 8.5rem); line-height: .92; margin: 0 0 1.25rem; letter-spacing: -0.015em; overflow-wrap: anywhere; }
.premiere .logline { font-family: var(--serif); font-style: italic; font-size: clamp(1.35rem, 2.6vw, 1.8rem); line-height: 1.3; margin: 0 0 1.25rem; max-width: 34ch; }
.premiere p { color: var(--snow-dim); max-width: 60ch; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
.btn { display: inline-flex; align-items: center; gap: .5rem; padding: .7rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 500; font-size: .98rem; border: 1px solid transparent; }
.btn.primary { background: var(--lamp); color: #2A1B02; }
.btn.primary:hover { background: #F2C46C; text-decoration: none; }
.btn.ghost { border-color: var(--night-rule); color: var(--snow); }
.btn.ghost:hover { border-color: var(--snow-dim); text-decoration: none; }

.cast { padding-bottom: clamp(3rem, 7vw, 5rem); }
.cast-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: .5rem 1.5rem; border-top: 1px solid var(--night-rule); padding-top: 1.25rem; margin-bottom: 1.5rem; }
.cast-head h2 { font-family: var(--serif); font-weight: 400; font-size: 2rem; margin: 0; }
.cast-head p { margin: 0; color: var(--snow-dim); font-size: .95rem; max-width: 48ch; }
.performers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1.5rem; }
.performer { background: var(--night-raised); border-radius: 10px; overflow: hidden; display: grid; grid-template-columns: 11rem minmax(0, 1fr); }
.performer-photo { background: #0A0F1B; border: 0; padding: 0; position: relative; min-height: 14rem; }
.performer-photo img { width: 100%; height: 100%; object-fit: cover; }
.performer-photo .enlarge { position: absolute; right: .5rem; bottom: .5rem; background: rgba(10,15,27,.8); color: var(--snow); font-size: .75rem; padding: .2rem .5rem; border-radius: 4px; }
.initials { width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--serif); font-size: 3rem; color: var(--snow-dim); }
.performer-body { padding: 1.25rem 1.25rem 1.4rem; }
.performer-body h3 { font-family: var(--serif); font-weight: 400; font-size: 1.75rem; margin: 0; line-height: 1.1; }
.performer-body .desc { color: var(--snow-dim); font-size: .92rem; margin: .5rem 0 1rem; }
.performer-body blockquote { margin: 0; padding-left: .9rem; border-left: 2px solid var(--lamp); font-family: var(--serif); font-style: italic; font-size: 1.15rem; line-height: 1.35; }
.performer-body .voice { font-size: .85rem; color: var(--snow-dim); margin: 1rem 0 0; }
.lock { display: inline-block; margin-top: .9rem; font-size: .78rem; padding: .15rem .55rem; border-radius: 4px; background: #3A2C12; color: var(--lamp); }

/* Paper sections inside a project */
.section { padding-block: clamp(3rem, 7vw, 5rem) 0; }
.section-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 2rem; border-top: 2px solid var(--rule-strong); padding-top: 1.25rem; margin-bottom: 2rem; }
.section-head h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.9rem, 3.5vw, 2.5rem); line-height: 1.05; margin: 0; }
.section-head p { margin: 0; color: var(--graphite); max-width: var(--measure); }

.tests { display: grid; gap: 2.5rem; }
.test { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 2rem; }
.test h3 { font-family: var(--serif); font-weight: 400; font-size: 1.6rem; margin: 0 0 .5rem; line-height: 1.1; }
.test-meta { color: var(--graphite); font-size: .92rem; }
.test-meta p { margin: 0 0 .75rem; }
.test-meta strong { color: var(--ink); font-weight: 600; }
.reading { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.switch { display: flex; border-bottom: 1px solid var(--rule); }
.switch button { flex: 1; background: transparent; border: 0; padding: .9rem 1rem; font-weight: 500; color: var(--graphite); border-bottom: 3px solid transparent; }
.switch button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--lamp); }
.switch button:hover { color: var(--ink); }
.panel { padding: 1.25rem 1.4rem 1.5rem; }
.panel:focus-visible { outline-offset: -3px; }
.panel .objective { font-family: var(--serif); font-style: italic; font-size: 1.3rem; line-height: 1.3; margin: 0 0 1.25rem; }
.beats { list-style: none; margin: 0; padding: 0; }
.beats li { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 1rem; padding: .7rem 0; border-top: 1px solid var(--rule); font-size: .97rem; }
.beats .time { color: var(--lamp-text); font-variant-numeric: tabular-nums; font-weight: 500; }
.panel .watch { margin: 1rem 0 0; font-size: .92rem; color: var(--graphite); }
.panel .watch strong { color: var(--ink); }

.pipeline { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--paper-raised); }
.pipeline li { padding: 1.2rem 1.25rem; border-right: 1px solid var(--rule); position: relative; }
.pipeline li:last-child { border-right: 0; }
.pipeline .state { display: inline-flex; align-items: center; gap: .4rem; font-size: .82rem; font-weight: 500; margin-bottom: .5rem; }
.pipeline .dot { width: .6rem; height: .6rem; border-radius: 50%; border: 2px solid currentColor; }
.pipeline .done .state { color: var(--graphite); }
.pipeline .done .dot { background: currentColor; }
.pipeline .current .state { color: var(--lamp-text); }
.pipeline .current .dot { background: var(--lamp); border-color: var(--lamp); }
.pipeline .next .state { color: var(--graphite); }
.pipeline h3 { font-size: 1rem; font-weight: 600; margin: 0 0 .25rem; }
.pipeline p { margin: 0; font-size: .9rem; color: var(--graphite); }

.files { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.files li { border-bottom: 1px solid var(--rule); }
.files a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; padding: 1rem 0; text-decoration: none; align-items: baseline; }
.files a:hover .file-name { text-decoration: underline; }
.file-name { font-weight: 500; }
.file-desc { display: block; color: var(--graphite); font-size: .92rem; margin-top: .15rem; }
.file-type { font-size: .8rem; color: var(--graphite); border: 1px solid var(--rule); border-radius: 4px; padding: .1rem .5rem; white-space: nowrap; }

.note { margin-top: 2rem; padding: 1.1rem 1.25rem; border-left: 3px solid var(--lamp); background: var(--paper-raised); color: var(--graphite); font-size: .95rem; max-width: var(--measure); }
.note strong { color: var(--ink); }

.pager { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; border-top: 1px solid var(--rule); margin-top: clamp(3rem, 7vw, 5rem); padding-block: 1.5rem 3rem; }
.pager a { text-decoration: none; }
.pager small { display: block; color: var(--graphite); font-size: .85rem; }
.pager span { font-family: var(--serif); font-size: 1.5rem; }
.pager a:hover span { text-decoration: underline; }

footer { border-top: 1px solid var(--rule); color: var(--graphite); font-size: .88rem; }
footer .wrap { padding-block: 1.5rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
footer p { margin: 0; max-width: 60ch; }

/* Lightbox */
dialog { border: 0; padding: 0; background: var(--night); color: var(--snow); border-radius: 10px; max-width: min(56rem, 94vw); width: 100%; }
dialog::backdrop { background: rgba(6, 9, 16, .78); }
.lb { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
.lb-img { background: #0A0F1B; min-height: 20rem; }
.lb-img img { width: 100%; height: 100%; object-fit: contain; max-height: 80vh; }
.lb-body { padding: 1.5rem 1.5rem 1.75rem; overflow: auto; max-height: 80vh; }
.lb-body h2 { font-family: var(--serif); font-weight: 400; font-size: 2rem; margin: 0 2.5rem .75rem 0; }
.lb-body h3 { font-size: .95rem; font-weight: 600; margin: 1.25rem 0 .4rem; }
.lb-body p { margin: 0; color: var(--snow-dim); font-size: .95rem; }
.lb-close { position: absolute; top: .75rem; right: .75rem; background: var(--night-raised); border: 1px solid var(--night-rule); color: var(--snow); border-radius: 6px; width: 2.4rem; height: 2.4rem; font-size: 1.3rem; line-height: 1; }

@media (max-width: 820px) {
  .entry-row { grid-template-columns: 3rem minmax(0, 1fr); }
  .entry-thumbs { grid-column: 2; justify-content: flex-start; }
  .entry-num { font-size: 2rem; }
  .upcoming-inner { grid-template-columns: 3rem minmax(0, 1fr); }
  .about, .section-head, .test { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
  .lb { grid-template-columns: minmax(0, 1fr); }
  .lb-img img { max-height: 50vh; }
}
@media (max-width: 480px) {
  .performer { grid-template-columns: minmax(0, 1fr); }
  .performer-photo { aspect-ratio: 4 / 5; }
  .beats li { grid-template-columns: minmax(0, 1fr); gap: .15rem; }
  .masthead nav { gap: 1rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .view-enter { animation: enter .45s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
</style>
</head>

<header class="masthead">
  <div class="wrap">
    <a class="brand" href="#/">Adina Halter <span>AI studio</span></a>
    <nav aria-label="Primary">
      <a href="#/" data-nav="work">Work</a>

<main id="main" tabindex="-1"></main>

<footer>

<script>
/* ---------------------------------------------------------------
   Portfolio data. To add a project, append an object to PROJECTS.
   Only id, title, medium, summary, and status are required; every
   section of the project page renders only when its data exists.
---------------------------------------------------------------- */
const REPO = "https://github.com/haltersweb/generative-agentic-ai";
const RAW = "https://raw.githubusercontent.com/haltersweb/generative-agentic-ai/master/";
const BLOB = REPO + "/blob/master/";

const PROJECTS = [
  {
    id: "wonderful",
    title: "Wonderful",
    medium: ["Video"],
    tools: ["Image generation", "Kling VIDEO 3.0"],
    status: "In pre-production",
    started: "September 2026",
    folder: "video/wonderful",
    summary: "Casting George Bailey for a modern transposition of It's a Wonderful Life, using two original AI performers, directed audition readings, and a repeatable test method.",
    logline: "Two invented actors. One impossible role. A casting process built to find out which one can actually act.",
    description: "I designed two fictional performers from scratch, generated their casting headshots, and wrote a director's audition packet that tests each man on the same two scenes: Potter's offer, and the night George breaks his children's models. The goal is to judge performance, not just a pretty frame.",
    castTitle: "The casting call",
    castNote: "Both performers are original fictional designs, not likenesses of real people. Their headshots are candidate references at age 40, and neither is locked yet.",
    performers: [
      {
        name: "Daniel Reyes",
        initials: "DR",
        image: "video/wonderful/daniel-reyes-headshot-v1.png",
        desc: "Compact and broad-chested, quick and magnetic. A credit union director who could have been a successful entrepreneur.",
        objective: "Let this man finally acknowledge what I am worth.",
        voice: "Middle-low pitch, forward resonance, quick conversational emphasis.",
        prompt: "Photorealistic casting headshot, 85mm at eye level, soft daylight, warm grey backdrop, apparent age exactly 40. Warm medium-brown skin, close-set dark eyes, slightly bent nose, square jaw, silver starting at the temples, one deeper smile crease. Unretouched, a unique invented person."
      },
      {
        name: "Adrian Shaw",
        initials: "AS",
        image: "video/wonderful/adrian-shaw-headshot-v1.png",
        desc: "Lean, with a long neck and contained restless intelligence. A man who expected to become an architect.",
        objective: "Let this offer reopen the future I thought was gone.",
        voice: "Middle pitch, precise consonants, compressed phrase endings when holding back.",
        prompt: "Photorealistic casting headshot, 85mm at eye level, soft daylight, warm grey backdrop, apparent age exactly 40. Light olive skin, high cheekbones, almond eyes under straight brows, subtly uneven angular jaw, stubborn crown, sparse silver at the temples. Attractive but ordinary, never model-perfect."
      }
    ],
    tests: [
      {
        title: "Potter's offer",
        length: "About 60 seconds",
        setting: "George at 34, a glass conference room in daylight. Potter is an off-camera reader; only his hand enters the frame.",
        question: "Does George accept in his head before the handshake, and can his first refusal come before he can explain it?",
        readings: [
          {
            performer: "Daniel Reyes",
            objective: "Let this man finally acknowledge what I am worth.",
            beats: [

              ["12–28s", "At the mention of travel his attention drifts; he's imagining movement. Real delight, not calculation."],

        readings: [

            ],

          },

/* --------------------------- Helpers --------------------------- */
const main = document.getElementById("main");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = i => String(i + 1).padStart(2, "0");
let activeFilter = "All";

/* Images load from the repo when hosted on GitHub Pages, fall back to
   raw.githubusercontent.com when opened locally, then to initials. */
function photo(p, cls = "") {
  return `<img class="${cls}" src="${esc(p.image)}" alt="Casting headshot of ${esc(p.name)}, an AI-generated fictional performer" loading="lazy" decoding="async"
    data-raw="${esc(RAW + p.image)}" data-initials="${esc(p.initials)}" onerror="imgFallback(this)">`;
}
function imgFallback(img) {
  if (img.dataset.raw && img.src !== img.dataset.raw) { img.src = img.dataset.raw; img.dataset.raw = ""; return; }
  const d = document.createElement("div");
  d.className = "initials"; d.setAttribute("aria-hidden", "true"); d.textContent = img.dataset.initials || "";
  img.replaceWith(d);
}

/* ------------------------- Index view -------------------------- */
function renderIndex(focusTarget) {
  const media = ["All", ...new Set(PROJECTS.flatMap(p => p.medium))];
  const list = PROJECTS.map((p, i) => ({ p, i })).filter(({ p }) => activeFilter === "All" || p.medium.includes(activeFilter));

  main.innerHTML = `
    <div class="view-enter">
      <section class="wrap intro" aria-labelledby="intro-title">
        <h1 id="intro-title" tabindex="-1">Directing machines that make things.</h1>
        <p>A growing record of my work in generative and agentic AI. Each project is shared with the prompts, direction, and decisions behind it, so you can see how the work was made, not just how it turned out.</p>
      </section>

      <section class="wrap" aria-labelledby="work-title" id="work">
        <div class="toolbar">
          <h2 id="work-title">Projects</h2>
          <div class="filters" role="group" aria-label="Filter projects by medium">
            ${media.map(m => {
              const n = m === "All" ? PROJECTS.length : PROJECTS.filter(p => p.medium.includes(m)).length;
              return `<button class="chip" data-filter="${esc(m)}" aria-pressed="${m === activeFilter}">${esc(m)}<span class="count">${n}</span></button>`;
            }).join("")}
          </div>
        </div>
        ${list.length ? `<ol class="entries">
          ${list.map(({ p, i }) => `
            <li class="entry">
              <div class="entry-row">
                <span class="entry-num" aria-hidden="true">${num(i)}</span>
                <div>
                  <h3><a class="entry-link" href="#/project/${esc(p.id)}">${esc(p.title)}</a></h3>
                  <p>${esc(p.summary)}</p>
                  <div class="tags">
                    <span class="tag status">${esc(p.status)}</span>
                    ${p.medium.map(m => `<span class="tag">${esc(m)}</span>`).join("")}
                    ${(p.tools || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
                  </div>
                </div>
                ${p.performers ? `<div class="entry-thumbs" aria-hidden="true">${p.performers.slice(0, 2).map(pf => `<div class="thumb">${photo(pf)}</div>`).join("")}</div>` : "<div></div>"}
              </div>
            </li>`).join("")}
          ${activeFilter === "All" ? `
            <li class="entry upcoming">
              <div class="upcoming-inner">
                <span class="entry-num" aria-hidden="true">${num(PROJECTS.length)}</span>
                <p>The next project is in development. Agent workflows and new media are on the way.</p>
              </div>
            </li>` : ""}
        </ol>` : `<p class="empty">Nothing in this medium yet. <button class="chip" data-filter="All">Show all projects</button></p>`}
      </section>

      <section class="wrap about" id="about" aria-labelledby="about-title">
        <h2 id="about-title">About this work</h2>
        <div>
          <p>I'm Adina Halter. This portfolio collects my experiments in generative and agentic AI, from designing fictional performers to directing them through repeatable, honest tests.</p>
          <p>My approach is the same across media: define what good looks like before generating anything, keep the prompts and direction in the open, and only report results I've actually observed.</p>
          <p><a href="${REPO}">Follow the work on GitHub</a></p>
        </div>
      </section>
    </div>`;

  main.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
    activeFilter = b.dataset.filter;
    renderIndex("filter");
    const shown = activeFilter === "All" ? PROJECTS.length : PROJECTS.filter(p => p.medium.includes(activeFilter)).length;
    document.getElementById("filter-status").textContent =
      `${activeFilter === "All" ? "All projects" : activeFilter}: ${shown} ${shown === 1 ? "project" : "projects"} shown`;
  }));

  document.title = "Adina Halter — Generative and agentic AI";
  setNav(focusTarget === "about" ? "about" : "work");
  if (focusTarget === "filter") {
    const btn = main.querySelector(`[data-filter="${CSS.escape(activeFilter)}"]`);
    if (btn) btn.focus();
  } else if (focusTarget === "return") {
    window.scrollTo(0, 0);
    document.getElementById("intro-title").focus({ preventScroll: true });
  } else if (focusTarget === "about") {
    document.getElementById("about").scrollIntoView();
    document.getElementById("about-title").setAttribute("tabindex", "-1");
    document.getElementById("about-title").focus({ preventScroll: true });
  }
}

/* ------------------------ Project view ------------------------- */
function renderProject(p) {
  const i = PROJECTS.indexOf(p);
  const prev = PROJECTS[i - 1], next = PROJECTS[i + 1];

  main.innerHTML = `
    <article class="view-enter" aria-labelledby="project-title">
      <div class="screen">
        <div class="wrap">
          <a class="back" href="#/"><span aria-hidden="true">&larr;</span> All projects</a>
          <header class="premiere">
            <p class="status-line">Project ${num(i)}, ${esc(p.status.toLowerCase())}${p.started ? `, started ${esc(p.started)}` : ""}</p>
            <h1 id="project-title" tabindex="-1">${esc(p.title)}</h1>
            ${p.logline ? `<p class="logline">${esc(p.logline)}</p>` : ""}
            <p>${esc(p.description || p.summary)}</p>
            <div class="actions">
              ${p.tests ? `<a class="btn primary" href="#auditions" data-scroll>See the auditions</a>` : ""}
              ${p.folder ? `<a class="btn ghost" href="${REPO}/tree/master/${esc(p.folder)}">Browse the files on GitHub</a>` : ""}
            </div>
          </header>

          ${p.performers ? `
          <section class="cast" aria-labelledby="cast-title">
            <div class="cast-head">
              <h2 id="cast-title">${esc(p.castTitle || "Cast")}</h2>
              ${p.castNote ? `<p>${esc(p.castNote)}</p>` : ""}
            </div>
            <div class="performers">
              ${p.performers.map((pf, k) => `
                <div class="performer">
                  <button class="performer-photo" data-lightbox="${k}" aria-label="Enlarge headshot and prompt for ${esc(pf.name)}">
                    ${photo(pf)}<span class="enlarge" aria-hidden="true">Enlarge</span>
                  </button>
                  <div class="performer-body">
                    <h3>${esc(pf.name)}</h3>
                    <p class="desc">${esc(pf.desc)}</p>
                    <blockquote>${esc(pf.objective)}</blockquote>
                    ${pf.voice ? `<p class="voice">Proposed voice: ${esc(pf.voice.charAt(0).toLowerCase() + pf.voice.slice(1))}</p>` : ""}
                    <span class="lock">Unlocked candidate</span>
                  </div>
                </div>`).join("")}
            </div>
          </section>` : ""}
        </div>
      </div>

      <div class="wrap">
        ${p.tests ? `
        <section class="section" id="auditions" aria-labelledby="auditions-title">
          <div class="section-head">
            <h2 id="auditions-title">The auditions</h2>
            <p>Both performers get the same scenes, camera, light, and timing, so the only variable is the performance. Switch between them to compare how each one is directed.</p>
          </div>
          <div class="tests">
            ${p.tests.map((t, ti) => `
              <div class="test">
                <div class="test-meta">
                  <h3>${esc(t.title)}</h3>
                  <p>${esc(t.length)}</p>
                  <p>${esc(t.setting)}</p>
                  <p><strong>What we're testing:</strong> ${esc(t.question)}</p>
                </div>
                <div class="reading">
                  <div class="switch" role="tablist" aria-label="${esc(t.title)} readings">
                    ${t.readings.map((r, ri) => `<button role="tab" id="tab-${ti}-${ri}" aria-controls="panel-${ti}-${ri}" aria-selected="${ri === 0}" tabindex="${ri === 0 ? 0 : -1}">${esc(r.performer)}</button>`).join("")}
                  </div>
                  ${t.readings.map((r, ri) => `
                    <div class="panel" role="tabpanel" id="panel-${ti}-${ri}" aria-labelledby="tab-${ti}-${ri}" tabindex="0" ${ri === 0 ? "" : "hidden"}>
                      <p class="objective">${esc(r.objective)}</p>
                      <ol class="beats">
                        ${r.beats.map(([time, text]) => `<li><span class="time">${esc(time)}</span><span>${esc(text)}</span></li>`).join("")}
                      </ol>
                      ${r.watch ? `<p class="watch"><strong>Watch for:</strong> ${esc(r.watch)}</p>` : ""}
                    </div>`).join("")}
                </div>
              </div>`).join("")}
          </div>
          ${p.honesty ? `<p class="note"><strong>Where this stands:</strong> ${esc(p.honesty)}</p>` : ""}
        </section>` : ""}

        ${p.pipeline ? `
        <section class="section" aria-labelledby="progress-title">
          <div class="section-head">
            <h2 id="progress-title">Progress</h2>
            <p>What's finished, what's underway, and what comes next.</p>
          </div>
          <ol class="pipeline">
            ${p.pipeline.map(s => `
              <li class="${esc(s.state)}">
                <span class="state"><span class="dot" aria-hidden="true"></span>${s.state === "done" ? "Done" : s.state === "current" ? "In progress" : "Up next"}</span>
                <h3>${esc(s.stage)}</h3>
                <p>${esc(s.note)}</p>
              </li>`).join("")}
          </ol>
        </section>` : ""}

        ${p.files ? `
        <section class="section" aria-labelledby="files-title">
          <div class="section-head">
            <h2 id="files-title">Process files</h2>
            <p>The working documents behind this project, open on GitHub. They're shared for reference; please check the licensing guide before reusing anything.</p>
          </div>
          <ul class="files">
            ${p.files.map(f => `
              <li><a href="${BLOB}${esc(f.path)}">
                <span><span class="file-name">${esc(f.name)}</span><span class="file-desc">${esc(f.desc)}</span></span>
                <span class="file-type">${esc(f.type)}</span>
              </a></li>`).join("")}
          </ul>
        </section>` : ""}

        <nav class="pager" aria-label="More projects">
          ${prev ? `<a href="#/project/${esc(prev.id)}"><small>Previous project</small><span>${esc(prev.title)}</span></a>` : `<a href="#/"><small>Back to</small><span>All projects</span></a>`}
          ${next ? `<a href="#/project/${esc(next.id)}" style="text-align:right"><small>Next project</small><span>${esc(next.title)}</span></a>` : `<a href="${REPO}" style="text-align:right"><small>More on the way</small><span>Follow on GitHub</span></a>`}
        </nav>
      </div>
    </article>`;

  /* Tabs with arrow-key support */
  main.querySelectorAll('[role="tablist"]').forEach(list => {
    const tabs = [...list.querySelectorAll('[role="tab"]')];
    const select = t => {
      tabs.forEach(x => {
        const on = x === t;
        x.setAttribute("aria-selected", on); x.tabIndex = on ? 0 : -1;
        document.getElementById(x.getAttribute("aria-controls")).hidden = !on;
      });
    };
    tabs.forEach((t, k) => {
      t.addEventListener("click", () => select(t));
      t.addEventListener("keydown", e => {
        let n;
        if (e.key === "ArrowRight") n = tabs[(k + 1) % tabs.length];
        else if (e.key === "ArrowLeft") n = tabs[(k - 1 + tabs.length) % tabs.length];
        else if (e.key === "Home") n = tabs[0];
        else if (e.key === "End") n = tabs[tabs.length - 1];
        else return;
        e.preventDefault();
        select(n); n.focus();
      });
    });
  });

  main.querySelectorAll("[data-scroll]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    const target = document.getElementById(a.getAttribute("href").slice(1));
    target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }));

  main.querySelectorAll("[data-lightbox]").forEach(b => b.addEventListener("click", () => openLightbox(p.performers[+b.dataset.lightbox], b)));

  document.title = `${p.title} — Adina Halter`;
  setNav("work");
  window.scrollTo(0, 0);
  document.getElementById("project-title").focus({ preventScroll: true });
}

/* -------------------------- Lightbox --------------------------- */
const lb = document.getElementById("lightbox");
let lbReturn = null;
function openLightbox(pf, opener) {
  lbReturn = opener;
  document.getElementById("lb-img").innerHTML = photo(pf);
  document.getElementById("lb-title").textContent = pf.name;
  document.getElementById("lb-desc").textContent = pf.desc;
  document.getElementById("lb-prompt").textContent = pf.prompt || "";
  document.getElementById("lb-status").textContent = "An original fictional AI performer. This headshot is a candidate reference and has not been approved as a final identity.";
  lb.showModal();
}
document.getElementById("lb-close").addEventListener("click", () => lb.close());
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
lb.addEventListener("close", () => { if (lbReturn) lbReturn.focus(); });

/* --------------------------- Router ---------------------------- */
function setNav(which) {
  document.querySelectorAll("[data-nav]").forEach(a => {
    if (a.dataset.nav === which) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
let firstRoute = true;
function route() {
  const hash = location.hash || "#/";
  const m = hash.match(/^#\/project\/([\w-]+)/);
  if (m) {
    const p = PROJECTS.find(x => x.id === m[1]);
    if (p) return renderProject(p);
  }
  if (hash === "#/about") return renderIndex("about");
  renderIndex(firstRoute ? undefined : "return");
}
window.addEventListener("hashchange", () => { firstRoute = false; route(); });
document.getElementById("year").textContent = new Date().getFullYear();
route();
</script>
